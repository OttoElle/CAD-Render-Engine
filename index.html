<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD Render Engine</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <header>
          <h1>CAD Render Engine</h1>
        </header>
        <nav id="tree" aria-label="Arbeitsschritte"></nav>
        <input id="file-input" type="file" accept=".step,.stp,.STEP,.STP" hidden />
      </aside>
      <main id="stage">
        <canvas id="viewport"></canvas>
        <div id="output-frame" hidden></div>
        <section id="panel" hidden></section>
        <div id="view-controls" hidden>
          <div id="viewcube-host"></div>
          <div id="view-tools">
            <button id="fit-btn" title="Modell einpassen (F)">Einpassen</button>
            <button id="edges-btn" title="Kanten ein- und ausblenden (E)" aria-pressed="true">Kanten</button>
          </div>
        </div>
        <div id="dropzone">
          <div class="dropzone-inner">
            <strong>STEP-Datei hierher ziehen</strong>
            <span>oder links unter „Geometrie“ eine Datei öffnen (.step, .stp)</span>
          </div>
        </div>
        <div id="render-view" hidden></div>
        <div id="status" hidden></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
