<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clearcoat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <img class="brand" src="/logo/clearcoat-logo.svg" alt="Clearcoat" />
        <nav class="breadcrumb" aria-label="Navigation">
          <button id="projects-btn" title="All projects">Projects</button>
          <span class="breadcrumb-separator" aria-hidden="true">›</span>
          <button id="project-chip" title="Name and template of this project"></button>
        </nav>
        <button id="settings-btn" class="icon-button" title="Settings" aria-label="Settings"></button>
      </header>
      <main id="stage">
        <canvas id="viewport"></canvas>
        <div id="output-frame" hidden></div>
        <div id="guides" hidden></div>
        <div id="focus-marker" hidden></div>
        <div id="dropzone">
          <div class="dropzone-inner">
            <strong>Drop a STEP file here</strong>
            <span>or open one under Geometry (.step, .stp)</span>
          </div>
        </div>
        <div id="render-view" hidden></div>
        <aside id="sidebar">
          <nav id="tree" aria-label="Steps"></nav>
        </aside>
        <section id="panel" hidden></section>
        <div id="toolbar" hidden>
          <button id="fit-btn"></button>
          <button id="center-btn"></button>
          <button id="edges-btn" aria-pressed="true"></button>
          <button id="axes-btn" aria-pressed="false"></button>
          <button id="guides-btn" aria-pressed="false"></button>
        </div>
        <div id="viewcube-host" hidden></div>
        <section id="overview" hidden></section>
        <div id="status" hidden></div>
        <div id="settings" hidden></div>
        <input id="file-input" type="file" accept=".step,.stp,.STEP,.STP" hidden />
        <input id="hdri-input" type="file" accept=".hdr,.exr,.HDR,.EXR" hidden />
        <input id="project-input" type="file" accept=".clearcoat" hidden />
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
